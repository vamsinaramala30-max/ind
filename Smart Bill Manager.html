<!DOCTYPE html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Smart Bill Manager</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mu:#667085;--bd:#e4e7ee;--pr:#4f46e5;--ok:#16a34a;--bad:#dc2626;--wa:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2a3350;--pr:#818cf8}}
:root[data-theme=dark]{--bg:#0f1420;--card:#192032;--tx:#e8ecf5;--mu:#98a2b8;--bd:#2a3350;--pr:#818cf8}
html,body{height:auto;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}h2{margin:.2em 0 .6em;font-size:1.05rem}h3{margin:0 0 .5em;font-size:.95rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:2px;padding:6px 8px;overflow-x:auto}
nav b{margin-right:auto;padding:6px 8px;white-space:nowrap}nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}nav button.on{background:var(--pr);color:#fff}
main{max-width:980px;margin:0 auto;padding:12px 12px 90px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.stat small{color:var(--mu);display:block}.stat b{font-size:1.2rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}.mu{color:var(--mu)}
input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);min-height:42px}
label{display:block;font-size:.8rem;color:var(--mu);margin:8px 0 3px}.btn{background:var(--pr);color:#fff;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;min-height:40px}.btn.g{background:none;color:var(--pr);border:1px solid var(--bd)}.btn.d{background:var(--bad)}.btn.s{padding:5px 9px;min-height:32px;font-size:.85rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1 1 120px}.row>.btn{flex:0 0 auto}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}.item .m{flex:1;min-width:0}.item .m div:first-child{overflow:hidden;text-overflow:ellipsis}.ic{font-size:1.3rem}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}.bar i.x{background:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:1.8rem;box-shadow:0 4px 14px #0004;z-index:6;padding:0}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}#modal.on{display:flex}
#modal>div{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}@media(min-width:600px){#modal{align-items:center}#modal>div{border-radius:16px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;z-index:30;display:none}
.tag{font-size:.72rem;padding:2px 7px;border-radius:99px;background:var(--bd)}.warn{background:#fef3c7;color:#92400e;padding:8px 12px;border-radius:10px;margin-bottom:10px}
.tr{display:flex;align-items:flex-end;gap:8px;height:110px}.tr div{flex:1;text-align:center;font-size:.7rem}.tr i{display:block;background:var(--pr);border-radius:5px 5px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
@media print{nav,.fab,.noprint{display:none!important}body{background:#fff;color:#000}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><button class="btn fab" aria-label="Add transaction" onclick="openTx()">+</button><div id="modal" role="dialog" aria-modal="true"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),KEY='billmgr_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF=['Food','Groceries','Snacks','Drinks','Transportation','Rent','Electricity','Mobile Recharge','Internet','Education','Healthcare','Clothing','Personal Care','Entertainment','Shopping','Loans','Subscriptions','Other'];
const IC={Food:'🍛',Groceries:'🛒',Snacks:'🍿',Drinks:'☕',Transportation:'🚌',Rent:'🏠',Electricity:'💡','Mobile Recharge':'📱',Internet:'📶',Education:'🎓',Healthcare:'🏥',Clothing:'👕','Personal Care':'💈',Entertainment:'🎬',Shopping:'🛍️',Loans:'🏦',Subscriptions:'🔁',Other:'📦',Savings:'🐖',Salary:'💼',Transfer:'↔️'};
const INC=['Salary','Business','Interest','Other income'],PM=['UPI','Cash','Card','Net Banking','Other'];
const KW={Food:'lunch dinner breakfast zomato swiggy restaurant biryani meal',Groceries:'grocery groceries vegetable vegetables milk bigbasket blinkit rice fruits',Snacks:'snack snacks chips biscuit samosa',Drinks:'tea coffee juice chai cold drink',Transportation:'petrol diesel uber ola auto bus metro train fuel rapido cab',Rent:'rent',Electricity:'electricity current eb',  'Mobile Recharge':'recharge jio airtel prepaid',Internet:'wifi broadband internet',Education:'school tuition fees course books',Healthcare:'doctor medicine pharmacy hospital apollo',Clothing:'shirt dress clothes saree jeans',  'Personal Care':'salon haircut soap shampoo',Entertainment:'movie netflix game cinema',Shopping:'amazon flipkart myntra',Loans:'emi loan',Subscriptions:'subscription prime spotify hotstar'};
const DISC=['Food','Snacks','Drinks','Entertainment','Shopping','Subscriptions'];
let S=null,mem=null,storeOK=true,V='dash',MON=today().slice(0,7),F={q:'',type:'',cat:'',pm:'',from:'',to:''},RP='month',RD=today(),lastPM='UPI';
function today(){const d=new Date();return iso(d)}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const dmy=d=>d.split('-').reverse().join('/');
const fmt=p=>(p<0?'-':'')+'₹'+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const toP=v=>{const n=Number(String(v).replace(/[,₹\s]/g,''));return isFinite(n)&&n>0&&n<=1e9?Math.round(n*100):null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const topc=c=>String(c).split(' › ')[0];
function fresh(){return{tx:[],trash:[],bills:[],cats:[...DEF],subs:[],budget:{total:0,cats:{}}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(fresh(),o)}}catch(e){storeOK=false}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storeOK=false;mem=S}}
function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?' <button class="btn s g" style="color:#fff;border-color:#fff6" onclick="window._u();$(\'#toast\').style.display=\'none\'">Undo</button>':'');window._u=undo;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',5000)}
function modal(h){const m=$('#modal');m.innerHTML='<div>'+h+'</div>';m.classList.add('on')}function closeM(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function ask(msg,cb,label='Confirm'){window._cb=cb;modal(`<p>${esc(msg)}</p><div class="row"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn d" onclick="closeM();window._cb()">${label}</button></div>`)}
const catList=()=>{const a=[];S.cats.forEach(c=>{a.push(c);S.subs.filter(s=>s.startsWith(c+' › ')).forEach(s=>a.push(s))});return a};
const icon=c=>IC[topc(c)]||'🏷️';
function suggest(txt){txt=' '+txt.toLowerCase()+' ';for(const c of S.cats)if(txt.includes(' '+c.toLowerCase()+' '))return c;for(const s of S.subs)if(txt.includes(' '+s.split(' › ')[1].toLowerCase()+' '))return s;for(const[c,w]of Object.entries(KW))if(S.cats.includes(c)&&w.split(' ').some(k=>txt.includes(' '+k+' ')||txt.includes(' '+k+'s ')))return c;return null}
// ---- calculations (amounts in paise) ----
const sumT=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+x.amt,0);
const inMon=m=>S.tx.filter(t=>t.date.startsWith(m));
const tot=l=>({inc:sumT(l,'income'),exp:sumT(l,'expense'),sav:sumT(l,'savings')});
const prevMon=m=>{let[y,mo]=m.split('-').map(Number);mo--;if(!mo){mo=12;y--}return y+'-'+String(mo).padStart(2,'0')};
function byCat(l){const o={};l.filter(t=>t.type==='expense').forEach(t=>{const c=topc(t.cat);o[c]=(o[c]||0)+t.amt});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function rng(p,d){const[y,m,dd]=d.split('-').map(Number),dt=new Date(y,m-1,dd);let a,b;if(p==='day')a=b=dt;else if(p==='week'){const w=(dt.getDay()+6)%7;a=new Date(y,m-1,dd-w);b=new Date(y,m-1,dd-w+6)}else if(p==='month'){a=new Date(y,m-1,1);b=new Date(y,m,0)}else{a=new Date(y,0,1);b=new Date(y,11,31)}return[iso(a),iso(b)]}
const dd=d=>{const[y,m,x]=d.split('-').map(Number);return Date.UTC(y,m-1,x)};const diff=d=>Math.round((dd(d)-dd(today()))/864e5);
function nextDue(due,day){let[y,m]=due.split('-').map(Number);m++;if(m>12){m=1;y++}const last=new Date(y,m,0).getDate();return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(day,last)).padStart(2,'0')}
function recs(m){const l=inMon(m),t=tot(l),p=tot(inMon(prevMon(m))),r=[];if(!l.length)return['Add a few transactions to receive personalised insights.'];
const b=S.budget.total;if(b>0){const u=t.exp/b;if(u>=1)r.push(`🚨 You have exceeded your monthly budget by ${fmt(t.exp-b)}. Pause non-essential spending.`);else if(u>=.8)r.push(`⚠️ ${Math.round(u*100)}% of your budget is used. Only ${fmt(b-t.exp)} remains.`)}
const pc=Object.fromEntries(byCat(inMon(prevMon(m))));byCat(l).forEach(([c,a])=>{const cb=S.budget.cats[c];if(cb&&a>cb)r.push(`🚨 ${c} is over its ${fmt(cb)} budget by ${fmt(a-cb)}.`);else if(pc[c]&&a>pc[c]*1.3&&a-pc[c]>=50000)r.push(`📈 ${c} spending is up ${Math.round((a/pc[c]-1)*100)}% vs last month (${fmt(pc[c])} → ${fmt(a)}).`)});
const d=byCat(l).filter(([c])=>DISC.includes(c)).reduce((a,x)=>a+x[1],0);if(t.exp>0&&d/t.exp>.35)r.push(`🍿 ${Math.round(d/t.exp*100)}% of spending is on discretionary items (food, snacks, drinks, entertainment, shopping, subscriptions). Trim these first.`);
if(t.inc>0&&t.sav/t.inc<.1)r.push(`🐖 You saved ${Math.round(t.sav/t.inc*100)}% of income. Aim for at least 10–20%.`);
const od=S.bills.filter(x=>!x.paid&&diff(x.due)<0).length;if(od)r.push(`⏰ ${od} bill(s) are overdue. Pay them to avoid late fees.`);
return r.length?r:['✅ Your spending looks healthy this month. Keep it up!']}
// ---- views ----
const NAV=[['dash','Dashboard'],['tx','Transactions'],['bills','Bills'],['rep','Reports'],['set','Settings']];
function go(v){V=v;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML='<b>💰 Bill Manager</b>'+NAV.map(n=>`<button class="${V===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
$('#app').innerHTML=(storeOK?'':'<div class="warn">Browser storage is unavailable, so data will be lost when you close this page. Use Settings → Backup regularly.</div>')+({dash,tx:txView,bills:billView,rep:repView,set:setView}[V])()}
function monPick(){return`<div class="row noprint"><button class="btn g" onclick="MON=prevMon(MON);render()" aria-label="Previous month">‹</button><input type="month" value="${MON}" onchange="MON=this.value||MON;render()" aria-label="Month"><button class="btn g" onclick="MON=nextM(MON);render()" aria-label="Next month">›</button></div>`}
const nextM=m=>{let[y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++}return y+'-'+String(mo).padStart(2,'0')}
function catBars(l,budgets){const c=byCat(l),T=c.reduce((a,x)=>a+x[1],0);if(!c.length)return'<p class="mu">No expenses in this period.</p>';return c.map(([n,a])=>{const b=budgets&&S.budget.cats[n];return`<div style="margin:8px 0"><div class="row" style="justify-content:space-between;gap:4px"><span>${icon(n)} ${esc(n)}</span><span style="text-align:right"><b>${fmt(a)}</b> <span class="mu">${Math.round(a/T*100)}%</span></span></div><div class="bar"><i class="${b&&a>b?'x':''}" style="width:${b?Math.min(100,a/b*100):a/T*100}%"></i></div>${b?`<small class="mu">Budget ${fmt(b)}</small>`:''}</div>`}).join('')}
function txRow(t,acts=true){const s=t.type==='income'?'+':t.type==='expense'?'-':'';const cl=t.type==='income'?'ok':t.type==='expense'?'bad':'mu';return`<div class="item"><span class="ic">${t.type==='transfer'?'↔️':icon(t.cat)}</span><div class="m"><div><b>${esc(t.purpose)}</b></div><small class="mu">${t.type!=='expense'?'<span class="tag">'+t.type+'</span> ':''}${esc(t.cat||'Transfer')} · ${esc(t.pm)} · ${dmy(t.date)}</small></div><b class="${cl}">${s}${fmt(t.amt)}</b>${acts?`<button class="btn s g" aria-label="Edit" onclick="openTx('${t.id}')">✎</button><button class="btn s g" aria-label="Delete" onclick="delTx('${t.id}')">🗑</button>`:''}</div>`}
function dash(){const l=inMon(MON),t=tot(l),all=tot(S.tx),b=S.budget.total,bal=all.inc-all.exp-all.sav;
const up=S.bills.filter(x=>!x.paid).sort((a,c)=>a.due.localeCompare(c.due)).slice(0,5);const due=S.bills.filter(x=>!x.paid&&diff(x.due)<=3);
const st=(k,v,c='')=>`<div class="card stat"><small>${k}</small><b class="${c}">${v}</b></div>`;
return`<h2>Dashboard</h2>${monPick()}${due.length?`<div class="warn" style="margin-top:10px">🔔 ${due.length} bill(s) overdue or due within 3 days: ${due.map(x=>esc(x.name)).join(', ')}</div>`:''}
<div class="card" style="margin-top:10px"><h3>Quick expense</h3><div class="row"><input id="qa" inputmode="decimal" placeholder="Amount ₹" aria-label="Amount"><input id="qp" placeholder="Purpose e.g. Lunch" aria-label="Purpose" maxlength="80"><button class="btn" onclick="quick()">Add</button></div><small class="mu">Today, ${lastPM}, category auto-suggested. Use + for full options.</small></div>
<div class="grid">${st('Income',fmt(t.inc),'ok')}${st('Expenses',fmt(t.exp),'bad')}${st('Savings',fmt(t.sav))}${st('Available balance (all time)',fmt(bal),bal<0?'bad':'')}${st('Monthly budget',b?fmt(b):'Not set')}${st('Remaining budget',b?fmt(b-t.exp):'—',b&&t.exp>b?'bad':'')}</div>
${b?`<div class="card"><div class="bar"><i class="${t.exp>b?'x':''}" style="width:${Math.min(100,t.exp/b*100)}%"></i></div><small class="mu">${Math.round(t.exp/b*100)}% of budget used</small></div>`:''}
<div class="two"><div class="card"><h3>Category-wise spending</h3>${catBars(l,true)}</div><div><div class="card"><h3>Recommendations</h3>${recs(MON).map(r=>`<p style="margin:.4em 0">${esc(r)}</p>`).join('')}</div><div class="card"><h3>Upcoming bills</h3>${up.length?up.map(x=>billRow(x,false)).join(''):'<p class="mu">No unpaid bills. Add them in Bills.</p>'}</div></div></div>
<div class="card"><h3>Recent transactions</h3>${S.tx.length?[...S.tx].sort((a,c)=>c.date.localeCompare(a.date)||c.ts-a.ts).slice(0,6).map(x=>txRow(x)).join(''):'<p class="mu">No transactions yet. Add your first with the + button.</p>'}</div>`}
function filt(){const q=F.q.toLowerCase();return S.tx.filter(t=>(!F.type||t.type===F.type)&&(!F.cat||topc(t.cat||'')===F.cat)&&(!F.pm||t.pm===F.pm)&&(!F.from||t.date>=F.from)&&(!F.to||t.date<=F.to)&&(!q||(t.purpose+' '+(t.desc||'')+' '+(t.cat||'')).toLowerCase().includes(q))).sort((a,c)=>c.date.localeCompare(a.date)||c.ts-a.ts)}
function listHTML(){const l=filt(),t=tot(l);return`<small class="mu">${l.length} result(s) · Income ${fmt(t.inc)} · Expenses ${fmt(t.exp)} · Savings ${fmt(t.sav)} (transfers excluded)</small>`+(l.length?l.map(x=>txRow(x)).join(''):'<p class="mu">No transactions match.</p>')}
function setF(k,v){F[k]=v;$('#txl').innerHTML=listHTML()}
function txView(){const o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');return`<h2>Transactions</h2><div class="card noprint"><div class="row"><input placeholder="Search…" value="${esc(F.q)}" oninput="setF('q',this.value)" aria-label="Search"><select onchange="setF('type',this.value)" aria-label="Type"><option value="">All types</option>${['expense','income','savings','transfer'].map(x=>`<option ${F.type===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="setF('cat',this.value)" aria-label="Category"><option value="">All categories</option>${o(S.cats,F.cat)}</select><select onchange="setF('pm',this.value)" aria-label="Payment"><option value="">All methods</option>${o(PM,F.pm)}</select></div><div class="row"><div><label>From</label><input type="date" value="${F.from}" onchange="setF('from',this.value)"></div><div><label>To</label><input type="date" value="${F.to}" onchange="setF('to',this.value)"></div><button class="btn g" onclick="F={q:'',type:'',cat:'',pm:'',from:'',to:''};render()">Clear</button></div></div>
<div class="card" id="txl">${listHTML()}</div>
${S.trash.length?`<div class="card"><h3>Recently deleted (${S.trash.length})</h3>${S.trash.map(t=>`<div class="item"><div class="m"><b>${esc(t.purpose)}</b><br><small class="mu">${fmt(t.amt)} · ${dmy(t.date)}</small></div><button class="btn s" onclick="restore('${t.id}')">Restore</button><button class="btn s d" onclick="purge('${t.id}')">Delete forever</button></div>`).join('')}</div>`:''}`}
function billRow(x,acts=true){const d=diff(x.due),st=x.paid?'<span class="ok">Paid</span>':d<0?`<span class="bad">Overdue ${-d}d</span>`:d===0?'<span class="wa">Due today</span>':`<span class="${d<=3?'wa':'mu'}">Due in ${d}d</span>`;
return`<div class="item"><span class="ic">${icon(x.cat)}</span><div class="m"><div><b>${esc(x.name)}</b> ${x.rec?'<span class="tag">monthly</span>':''}</div><small>${st} · ${dmy(x.due)}${x.lastPaid?' · last paid '+dmy(x.lastPaid):''}</small></div><b>${fmt(x.amt)}</b>${acts?(x.paid?'':`<button class="btn s" onclick="payBill('${x.id}')">Mark paid</button>`)+`<button class="btn s g" aria-label="Edit" onclick="openBill('${x.id}')">✎</button><button class="btn s g" aria-label="Delete" onclick="delBill('${x.id}')">🗑</button>`:''}</div>`}
function billView(){const u=S.bills.filter(x=>!x.paid).sort((a,c)=>a.due.localeCompare(c.due)),p=S.bills.filter(x=>x.paid);return`<h2>Bills</h2><button class="btn" onclick="openBill()">+ Add bill</button><div class="card" style="margin-top:10px"><h3>Unpaid (${u.length}) · ${fmt(u.reduce((a,x)=>a+x.amt,0))}</h3>${u.length?u.map(x=>billRow(x)).join(''):'<p class="mu">No unpaid bills.</p>'}</div><div class="card"><h3>Paid one-time bills</h3>${p.length?p.map(x=>billRow(x)).join(''):'<p class="mu">None yet. Recurring bills roll over to next month when paid; each payment is logged as an expense.</p>'}</div><p class="mu">Reminders appear in-app on the Dashboard (overdue or due in 3 days). Push notifications aren't available in this page.</p>`}
function repView(){const[a,b]=rng(RP,RD),l=S.tx.filter(t=>t.date>=a&&t.date<=b),t=tot(l);const cur=tot(inMon(RD.slice(0,7))),pv=tot(inMon(prevMon(RD.slice(0,7))));
let ms=[],m=RD.slice(0,7);for(let i=0;i<6;i++){ms.unshift(m);m=prevMon(m)}const ex=ms.map(x=>tot(inMon(x)).exp),mx=Math.max(1,...ex);
const dl=(c,p)=>{const d=c-p;return`<span class="${d>0?'bad':'ok'}">${d>0?'+':''}${fmt(d)}</span>`};
return`<h2>Reports</h2><div class="card noprint"><div class="row"><select onchange="RP=this.value;render()" aria-label="Period">${['day','week','month','year'].map(x=>`<option value="${x}" ${RP===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}ly`.replace('Dayly','Daily')+'</option>').join('')}</select><input type="date" value="${RD}" onchange="RD=this.value||RD;render()" aria-label="Reference date"><button class="btn g" onclick="window.print()">Print / Save PDF</button><button class="btn g" onclick="exportCSV(true)">Export CSV</button></div></div>
<div class="card"><h3>${dmy(a)} – ${dmy(b)}</h3><div class="grid"><div class="stat"><small>Income</small><b class="ok">${fmt(t.inc)}</b></div><div class="stat"><small>Expenses</small><b class="bad">${fmt(t.exp)}</b></div><div class="stat"><small>Savings</small><b>${fmt(t.sav)}</b></div><div class="stat"><small>Net</small><b>${fmt(t.inc-t.exp-t.sav)}</b></div></div></div>
<div class="two"><div class="card"><h3>Spending by category</h3>${catBars(l)}</div><div><div class="card"><h3>Expense trend (6 months)</h3><div class="tr">${ex.map((v,i)=>`<div><small>${fmt(v).replace('.00','')}</small><i style="height:${v/mx*80}px"></i>${ms[i].slice(5)}/${ms[i].slice(2,4)}</div>`).join('')}</div></div>
<div class="card"><h3>${RD.slice(0,7)} vs previous month</h3><table><tr><th></th><th>This</th><th>Last</th><th>Change</th></tr>${[['Income','inc'],['Expenses','exp'],['Savings','sav']].map(([n,k])=>`<tr><td>${n}</td><td>${fmt(cur[k])}</td><td>${fmt(pv[k])}</td><td>${dl(cur[k],pv[k])}</td></tr>`).join('')}</table></div></div></div>`}
function setView(){const bc=S.cats.map(c=>`<div class="row"><span style="flex:1 1 140px">${icon(c)} ${esc(c)}</span><input inputmode="decimal" style="flex:1 1 100px" placeholder="No limit" value="${S.budget.cats[c]?S.budget.cats[c]/100:''}" onchange="setCB(this,'${esc(c).replace(/'/g,"\\'")}')" aria-label="Budget for ${esc(c)}"></div>`).join('');
return`<h2>Settings</h2><div class="card"><h3>Monthly budget</h3><div class="row"><input id="bt" inputmode="decimal" placeholder="Total ₹ per month" value="${S.budget.total?S.budget.total/100:''}"><button class="btn" onclick="setBudget()">Save</button></div><h3 style="margin-top:14px">Category budgets (₹)</h3>${bc}</div>
<div class="card"><h3>Custom categories</h3><div class="row"><input id="nc" placeholder="New category" maxlength="30"><button class="btn" onclick="addCat()">Add</button></div><div class="row" style="margin-top:8px"><select id="np" aria-label="Parent">${S.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="ns" placeholder="Subcategory" maxlength="30"><button class="btn" onclick="addSub()">Add</button></div>${S.subs.length?`<p class="mu">Subcategories: ${S.subs.map(esc).join(', ')}</p>`:''}</div>
<div class="card"><h3>Export, backup &amp; restore</h3><div class="row"><button class="btn g" onclick="exportCSV()">Export CSV (opens in Excel)</button><button class="btn g" onclick="backup()">Backup (JSON)</button><button class="btn g" onclick="restoreUI()">Restore backup</button></div></div>
<div class="card"><h3>Danger zone</h3><button class="btn d" onclick="ask('Erase ALL transactions, bills and settings from this browser? Make a backup first.',()=>{S=fresh();save();toast('All data erased');render()},'Erase all')">Erase all data</button></div>
<p class="mu">Data is stored privately in this browser on this device. There is no login or cloud sync; use backups to move data between devices.</p>`}
// ---- actions ----
function setBudget(){const v=$('#bt').value.trim();if(!v){S.budget.total=0}else{const p=toP(v);if(!p)return toast('Enter a valid amount');S.budget.total=p}save();toast('Budget saved')}
function setCB(el,c){const v=el.value.trim();if(!v)delete S.budget.cats[c];else{const p=toP(v);if(!p){el.value='';return toast('Enter a valid amount')}S.budget.cats[c]=p}save();toast('Saved')}
function addCat(){const n=$('#nc').value.trim();if(!n||n.includes('›'))return toast('Enter a valid name');if(S.cats.some(c=>c.toLowerCase()===n.toLowerCase()))return toast('Category already exists');S.cats.push(n);save();render();toast('Category added')}
function addSub(){const n=$('#ns').value.trim(),p=$('#np').value;if(!n||n.includes('›'))return toast('Enter a valid name');const s=p+' › '+n;if(S.subs.includes(s))return toast('Already exists');S.subs.push(s);save();render();toast('Subcategory added')}
function openTx(id){const t=id?S.tx.find(x=>x.id===id):{type:'expense',date:today(),pm:lastPM,cat:'',purpose:'',desc:'',amt:''};window._tx=t;
modal(`<h2>${id?'Edit':'New'} transaction</h2><label>Type</label><select id="f_t" onchange="typeCh()">${['expense','income','savings','transfer'].map(x=>`<option ${t.type===x?'selected':''}>${x}</option>`).join('')}</select><label>Amount (₹)</label><input id="f_a" inputmode="decimal" value="${t.amt?t.amt/100:''}"><label>Purpose</label><input id="f_p" maxlength="80" value="${esc(t.purpose)}" oninput="autoCat()"><label>Category</label><select id="f_c" onchange="this.dataset.m=1"></select><label>Date</label><input id="f_d" type="date" value="${t.date}"><label>Payment method</label><select id="f_m">${PM.map(x=>`<option ${t.pm===x?'selected':''}>${x}</option>`).join('')}</select><label>Description (optional)</label><textarea id="f_n" maxlength="300" rows="2">${esc(t.desc)}</textarea><p id="f_e" class="bad" role="alert"></p><div class="row"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="saveTx(${id?`'${id}'`:''})">Save</button></div>`);typeCh(t.cat);if(id)$('#f_c').dataset.m=1}
function typeCh(sel){const ty=$('#f_t').value,c=$('#f_c');const opts=ty==='expense'?catList():ty==='income'?INC:ty==='savings'?['Savings']:['Transfer'];c.innerHTML=opts.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');c.disabled=ty==='transfer'||ty==='savings';if(!sel)c.dataset.m=''}
function autoCat(){const c=$('#f_c');if(c.dataset.m||$('#f_t').value!=='expense')return;const s=suggest($('#f_p').value+' '+$('#f_n').value);if(s)c.value=s}
function build(){const ty=$('#f_t').value,amt=toP($('#f_a').value),p=$('#f_p').value.trim(),d=$('#f_d').value;let e='';if(!amt)e='Enter an amount greater than 0 (max ₹100 crore).';else if(!p)e='Purpose is required.';else if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(dd(d)))e='Choose a valid date.';if(e){$('#f_e').textContent=e;return null}return{type:ty,amt,purpose:p,cat:ty==='transfer'?'':$('#f_c').value,date:d,pm:$('#f_m').value,desc:$('#f_n').value.trim()}}
function saveTx(id,force){const o=build();if(!o)return;const dup=S.tx.find(x=>x.id!==id&&x.type===o.type&&x.amt===o.amt&&x.date===o.date&&x.cat===o.cat&&x.purpose.toLowerCase()===o.purpose.toLowerCase());
if(dup&&!force){$('#f_e').innerHTML='Possible duplicate: same amount, date, category and purpose already exists. <button class="btn s d" onclick="saveTx('+(id?`'${id}'`:'null')+',true)">Save anyway</button>';return}
lastPM=o.pm;if(id){Object.assign(S.tx.find(x=>x.id===id),o)}else S.tx.push({id:uid(),ts:Date.now(),...o});save();closeM();toast(id?'Transaction updated':'Transaction added');render()}
function quick(){const amt=toP($('#qa').value),p=$('#qp').value.trim();if(!amt||!p)return toast('Enter amount and purpose');const c=suggest(p)||'Other';const dup=S.tx.some(x=>x.type==='expense'&&x.amt===amt&&x.date===today()&&x.purpose.toLowerCase()===p.toLowerCase());
const add=()=>{S.tx.push({id:uid(),ts:Date.now(),type:'expense',amt,purpose:p,cat:c,date:today(),pm:lastPM,desc:''});save();render();toast('Added to '+c)};dup?ask('A same-day expense with this amount and purpose already exists. Add again?',add,'Add anyway'):add()}
function delTx(id){const t=S.tx.find(x=>x.id===id);S.tx=S.tx.filter(x=>x.id!==id);S.trash.push({...t,del:Date.now()});save();render();toast('Moved to Recently deleted',()=>restore(id))}
function restore(id){const t=S.trash.find(x=>x.id===id);if(!t)return;S.trash=S.trash.filter(x=>x.id!==id);delete t.del;S.tx.push(t);save();render();toast('Restored')}
function purge(id){ask('Permanently delete this transaction?',()=>{S.trash=S.trash.filter(x=>x.id!==id);save();render()},'Delete forever')}
function openBill(id){const b=id?S.bills.find(x=>x.id===id):{name:'',amt:'',cat:'Other',due:today(),rec:false};modal(`<h2>${id?'Edit':'New'} bill</h2><label>Name</label><input id="b_n" maxlength="60" value="${esc(b.name)}" oninput="const s=suggest(this.value);if(s)$('#b_c').value=s"><label>Amount (₹)</label><input id="b_a" inputmode="decimal" value="${b.amt?b.amt/100:''}"><label>Category</label><select id="b_c">${catList().map(c=>`<option ${c===b.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Due date</label><input id="b_d" type="date" value="${b.due}"><label class="row" style="flex-wrap:nowrap;color:var(--tx)"><input id="b_r" type="checkbox" style="width:auto;flex:0 0 auto;min-height:0" ${b.rec?'checked':''}> Repeats every month</label><p id="b_e" class="bad" role="alert"></p><div class="row"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="saveBill(${id?`'${id}'`:''})">Save</button></div>`)}
function saveBill(id){const n=$('#b_n').value.trim(),a=toP($('#b_a').value),d=$('#b_d').value;if(!n||!a||!d||isNaN(dd(d))){$('#b_e').textContent='Name, valid amount and due date are required.';return}const o={name:n,amt:a,cat:$('#b_c').value,due:d,day:+d.slice(8),rec:$('#b_r').checked};if(id)Object.assign(S.bills.find(x=>x.id===id),o);else S.bills.push({id:uid(),paid:false,...o});save();closeM();toast('Bill saved');render()}
function delBill(id){ask('Delete this bill? Past payments stay in Transactions.',()=>{S.bills=S.bills.filter(x=>x.id!==id);save();render()},'Delete')}
function payBill(id){const b=S.bills.find(x=>x.id===id);modal(`<h2>Mark “${esc(b.name)}” paid</h2><p>${fmt(b.amt)} will be recorded as an expense under ${esc(b.cat)} dated today.</p><label>Payment method</label><select id="pp">${PM.map(x=>`<option ${x===lastPM?'selected':''}>${x}</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="doPay('${id}')">Confirm</button></div>`)}
function doPay(id){const b=S.bills.find(x=>x.id===id),pm=$('#pp').value;lastPM=pm;S.tx.push({id:uid(),ts:Date.now(),type:'expense',amt:b.amt,purpose:b.name+' (bill)',cat:b.cat,date:today(),pm,desc:'Bill payment',billId:b.id});b.lastPaid=today();if(b.rec)b.due=nextDue(b.due,b.day||+b.due.slice(8));else{b.paid=true}save();closeM();toast('Bill paid and logged');render()}
// ---- export / backup ----
function showText(title,text,fn,mime){modal(`<h2>${title}</h2><p class="mu">If the download doesn't start, copy the text below and save it in a file named ${fn}.</p><textarea id="xt" rows="8" readonly>${esc(text)}</textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="$('#xt').select();document.execCommand('copy');toast('Copied')">Copy</button><button class="btn g" onclick="closeM()">Close</button></div>`);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:mime}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function exportCSV(rep){const l=rep?(()=>{const[a,b]=rng(RP,RD);return S.tx.filter(t=>t.date>=a&&t.date<=b)})():[...S.tx].sort((a,c)=>a.date.localeCompare(c.date));const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
const rows=[['Date','Type','Purpose','Category','Payment','Amount (INR)','Description'],...l.map(t=>[dmy(t.date),t.type,t.purpose,t.cat,t.pm,(t.amt/100).toFixed(2),t.desc])];showText('CSV export',rows.map(r=>r.map(q).join(',')).join('\r\n'),'transactions.csv','text/csv')}
function backup(){showText('Backup',JSON.stringify({app:'billmgr',v:1,at:new Date().toISOString(),data:S}),'bill-manager-backup.json','application/json')}
function restoreUI(){modal(`<h2>Restore backup</h2><p class="mu">This replaces all current data. Choose a backup file or paste its contents.</p><input type="file" accept=".json,application/json" onchange="rdFile(this)"><label>Or paste</label><textarea id="rt" rows="5"></textarea><p id="r_e" class="bad" role="alert"></p><div class="row"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn d" onclick="doRestore()">Restore</button></div>`)}
function rdFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('#rt').value=r.result;r.readAsText(f)}
function doRestore(){try{const o=JSON.parse($('#rt').value.replace(/^\ufeff/,'')),d=o.data;if(o.app!=='billmgr'||!Array.isArray(d.tx)||!Array.isArray(d.bills))throw 0;if(!d.tx.every(t=>t&&t.id&&Number.isInteger(t.amt)&&t.amt>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&['expense','income','savings','transfer'].includes(t.type)))throw 0;S=Object.assign(fresh(),d);save();closeM();toast('Backup restored');render()}catch(e){$('#r_e').textContent='This is not a valid backup file. Nothing was changed.'}}
S=load();render();
</script></body></html>
